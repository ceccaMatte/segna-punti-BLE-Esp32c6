<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Wearable config</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1080px;margin:0 auto;padding:24px 16px 56px;background:#f5f5f7;color:#151515}
    h1{font-size:1.8rem;margin:8px 0 4px}
    h2{font-size:1.15rem;margin:0 0 16px}
    .subtitle{color:#666;margin:0 0 20px}
    .card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 1px 8px #00000010}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
    .mapping{border-top:1px solid #eee;padding-top:12px;margin-top:12px}
    .mapping:first-child{border-top:0;margin-top:0;padding-top:0}
    .step{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}
    .chord{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 8px;border:1px solid #ddd;border-radius:10px}
    .chord label{display:inline-flex;gap:4px;align-items:center}
    button,input,select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid #c9c9ce;background:#fff}
    button{cursor:pointer}
    button.primary{background:#151515;color:#fff;border-color:#151515}
    button.danger{color:#a40018}
    input[type=checkbox]{padding:0}
    .status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .dot{width:10px;height:10px;border-radius:50%;background:#999}
    .dot.ok{background:#1a8f3b}
    .dot.bad{background:#c62828}
    .muted{color:#6b6b70;font-size:.92rem}
    .badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f0f0f2;font-size:.85rem}
    @media(max-width:600px){body{padding-top:14px}.card{padding:16px}.row{align-items:stretch}.row>label{width:100%}}
  </style>
</head>
<body>
  <h1>Wearable configuration</h1>
  <p class="subtitle">ESP32-C3 · configurazione locale via Wi-Fi</p>

  <div class="card">
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <strong id="statusText">Connessione…</strong>
      <span id="ssid" class="badge">wearable_config_eps32_c3</span>
      <span id="ble" class="badge">BLE: —</span>
    </div>
    <div class="muted" style="margin-top:10px">Rete aperta senza password. I dettagli di debug sono nella console del browser.</div>
  </div>

  <div class="card">
    <h2>Timing gesture</h2>
    <div class="row">
      <label>Sequenza <input id="seqGap" type="number" min="100" max="1500"> ms</label>
      <label>Multi-click <input id="multiGap" type="number" min="120" max="1000"> ms</label>
      <label>Long press <input id="longMs" type="number" min="400" max="5000"> ms</label>
      <label>Simultanea <input id="chordMs" type="number" min="25" max="250"> ms</label>
      <button id="saveTiming" class="primary">Salva timing</button>
    </div>
  </div>

  <div class="card">
    <h2>Gesture → azione</h2>
    <div id="mappings"></div>
    <button id="addMapping">Aggiungi gesture</button>
  </div>

  <div class="card">
    <h2>Suoni azioni</h2>
    <div id="sounds"></div>
  </div>

  <div class="card">
    <button id="defaults" class="danger">Ripristina configurazione di default</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
